name: Install the Lua interpreters
description: >
  The interpreters luamerge's tests run their bundles on: each name of
  LUATEST_INTERPRETERS is an Ubuntu package and its command.

inputs:
  interpreters:
    description: comma-separated, as LUATEST_INTERPRETERS
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INTERPRETERS: ${{ inputs.interpreters }}
      run: |
        read -ra lua <<<"${INTERPRETERS//,/ }"
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends "${lua[@]}"
        for l in "${lua[@]}"; do
          printf '%s: ' "$l"
          "$l" -e 'print((jit and jit.version) or _VERSION)'
        done
