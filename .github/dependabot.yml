# Keeps the actions of .github/workflows (pinned by commit) and the module's
# dependencies (luamerge's: go-config, pflag, testify) at their latest
# releases: a weekly pull request per ecosystem, its updates grouped into
# one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      modules:
        patterns: ['*']
