name: Release

# luamerge's binaries, archives and multi-platform Docker image, built and
# published by GoReleaser (luamerge/.goreleaser.yml, run in luamerge/) for a
# version tag of the module. Only a pushed tag v* runs this workflow: pushes
# to master and pull requests never publish anything (ci.yml checks the
# config with goreleaser check).

on:
  push:
    tags: ['v*']

# Least privilege: the workflow default is read-only, and only the job that
# publishes (release) elevates to contents/packages write.
permissions:
  contents: read

env:
  # Keep in sync with ci.yml.
  LUATEST_INTERPRETERS: lua5.1,lua5.2,lua5.3,lua5.4,luajit

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: install Lua interpreters
        run: |
          interpreters="${LUATEST_INTERPRETERS//,/ }"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $interpreters
          for lua in $interpreters; do
            printf '%s: ' "$lua"
            "$lua" -e 'print((jit and jit.version) or _VERSION)'
          done

      - name: go test
        run: go test -count=1 ./luamerge/... ./lua/...

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # buildx with the docker-container driver is required for multi-platform
      # images and SBOM attestations (the default docker driver supports neither).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --clean
          workdir: luamerge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
