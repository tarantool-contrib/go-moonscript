name: Vulnerability scanning with govulncheck

on:
  schedule:
    - cron: "0 0 * * 6" # Weekly on Saturday at 00:00 UTC.
  push:
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  # actions/setup-go exports GOTOOLCHAIN=local, so this job runs exactly the Go
  # version above and cannot switch toolchains. Pin to an exact govulncheck
  # release rather than "latest": v1.7.0 was seen panicking in a scheduled run,
  # and v1.8.0 requires go >= 1.26.0, which GO_VERSION above satisfies.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: run govulncheck
        run: govulncheck ./...
