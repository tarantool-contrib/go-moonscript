name: testing

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The tests that execute bundles run them on every Lua interpreter on PATH
  # and skip when there is none. Listing the interpreters the jobs install
  # makes a missing one fail those tests instead (see internal/luatest). Each
  # name is also the Ubuntu package that provides it.
  LUATEST_INTERPRETERS: lua5.1,lua5.2,lua5.3,lua5.4,luajit

# Run on push and on PRs from forks, but skip PRs from the same repository —
# otherwise internal branches would run CI twice.
jobs:
  run-tests:
    if: (github.event_name == 'push') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository) ||
        (github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        golang: ['1.26', 'stable']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.golang }}

      - name: install Lua interpreters
        run: |
          interpreters="${LUATEST_INTERPRETERS//,/ }"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $interpreters
          for lua in $interpreters; do
            printf '%s: ' "$lua"
            "$lua" -e 'print((jit and jit.version) or _VERSION)'
          done

      - name: run tests
        run: make test

      - name: run tests with race
        run: make testrace

  run-tests-with-coverage:
    if: (github.event_name == 'push') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository) ||
        (github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install Lua interpreters
        run: |
          interpreters="${LUATEST_INTERPRETERS//,/ }"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $interpreters
          for lua in $interpreters; do
            printf '%s: ' "$lua"
            "$lua" -e 'print((jit and jit.version) or _VERSION)'
          done

      - name: run tests, collect coverage and send to Coveralls
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make coverage coveralls-deps coveralls
